name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Validate SAM template
        run: cfn-lint template.yaml
      - name: Unit tests
        run: pytest -q
      - name: Offline end-to-end run on sample PDFs
        run: python scripts/local_pipeline_runner.py --provider local
      - name: Retrieval latency benchmark
        run: python scripts/bench_retrieval.py
